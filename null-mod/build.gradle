plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // CI drives a scripted client session with -PnullAutotest=<scenario>.
            if (project.hasProperty('nullAutotest')) {
                systemProperty 'null.autotest', project.property('nullAutotest').toString()
            }
            // ...and can point it straight at a server with -PnullQuickPlay=<address>.
            if (project.hasProperty('nullQuickPlay')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('nullQuickPlay').toString()
            }
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('nullAutotest')) {
                systemProperty 'null.autotest', project.property('nullAutotest').toString()
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // Grouping label only; the jar's module is named after the first entry in
        // neoforge.mods.toml ("nullmod"), because "null" is not a valid Java module name.
        nullmod {
            sourceSet(sourceSets.main)
        }
    }
}

// TEMPORARY: these systems are still being written; build and test the finished ones meanwhile.
sourceSets.main.java {
    exclude 'dev/kristian/nullmod/chat/**', 'dev/kristian/nullmod/dimension/**',
            'dev/kristian/nullmod/client/dimension/**', 'dev/kristian/nullmod/entity/nullroot/**',
            'dev/kristian/nullmod/client/nullroot/**', 'dev/kristian/nullmod/client/desktop/**',
            'dev/kristian/nullmod/client/settings/**', 'dev/kristian/nullmod/client/menu/**',
            'dev/kristian/nullmod/gametest/ChatGameTests.java', 'dev/kristian/nullmod/gametest/NullrootGameTests.java',
            'dev/kristian/nullmod/gametest/DimensionGameTests.java'
}
sourceSets.main.resources {
    exclude 'data/null/dimension/**', 'data/null/dimension_type/**', 'data/null/worldgen/**',
            'data/null/damage_type/**', 'data/minecraft/tags/damage_type/**'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Show every error in one pass; CI is the only compiler this project has.
    options.compilerArgs += ['-Xmaxerrs', '5000', '-Xmaxwarns', '0']
}
