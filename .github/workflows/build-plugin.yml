name: Build Combat Log Plugin

on:
  push:
    paths:
      - 'combat-log-plugin/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build plugin
        working-directory: combat-log-plugin
        run: mvn -B -ntp clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CombatLog-jar
          path: combat-log-plugin/target/CombatLog-*.jar
          if-no-files-found: error
