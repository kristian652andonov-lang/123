name: Build Combat Log Plugin

on:
  push:
    paths:
      - 'combat-log-plugin/**'
      - '.github/workflows/build-plugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build plugin
        working-directory: combat-log-plugin
        run: mvn -B -ntp clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: CombatLog-jar
          path: combat-log-plugin/target/CombatLog-*.jar
          if-no-files-found: error

      # Compiling is not the same as loading. Boot a real Paper 1.20.1 server
      # with WorldGuard installed and make sure the plugin enables, hooks the
      # region API, renders its messages and shuts down without throwing.
      - name: Smoke test on Paper 1.20.1 + WorldGuard
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          cp combat-log-plugin/target/CombatLog-*.jar server/plugins/
          cd server

          curl -sSfL -H "User-Agent: combatlog-ci/1.0" \
            https://fill.papermc.io/v3/projects/paper/versions/1.20.1/builds > builds.json
          PAPER_URL=$(python3 - <<'PICK'
          import re
          raw = open("builds.json", encoding="utf-8").read()
          # Take the first paper jar link in the response, whatever the schema
          # around it looks like - the newest build is listed first.
          found = re.findall(r'https://[^"\s]+/paper-1\.20\.1-\d+\.jar', raw)
          print(found[0] if found else "")
          PICK
          )
          if [ -z "$PAPER_URL" ]; then
            echo "Could not find a Paper 1.20.1 download in:"; head -c 2000 builds.json; exit 1
          fi
          echo "Using $PAPER_URL"
          curl -sSfL -H "User-Agent: combatlog-ci/1.0" -o paper.jar "$PAPER_URL"

          python3 - <<'GET'
          import json, urllib.request, zipfile

          PLUGIN_LOADERS = {"bukkit", "spigot", "paper", "purpur", "folia"}

          # WorldEdit 7.3+ and WorldGuard 7.1+ are built for Java 21. Pin the
          # 1.20.1-era pair so the server can actually load them on JDK 17.
          TARGETS = (
              ("worldedit", "plugins/worldedit.jar", "7.2."),
              ("worldguard", "plugins/worldguard.jar", "7.0."),
          )

          def fetch(url):
              request = urllib.request.Request(url, headers={"User-Agent": "combatlog-ci/1.0"})
              return urllib.request.urlopen(request).read()

          def primary_jar(version):
              return next((f for f in version["files"]
                           if f.get("primary") and f["filename"].endswith(".jar")), None)

          for slug, out, prefix in TARGETS:
              api = ("https://api.modrinth.com/v2/project/" + slug
                     + "/version?game_versions=%5B%221.20.1%22%5D")
              versions = [v for v in json.loads(fetch(api))
                          if PLUGIN_LOADERS.intersection(v.get("loaders", []))
                          and primary_jar(v)]
              if not versions:
                  raise SystemExit("no 1.20.1 plugin build published for " + slug)

              print(slug + " candidates: "
                    + ", ".join(v["version_number"] for v in versions[:8]))
              chosen = next((v for v in versions
                             if v["version_number"].startswith(prefix)), versions[0])
              jar = primary_jar(chosen)
              print("  -> " + jar["filename"])

              with open(out, "wb") as handle:
                  handle.write(fetch(jar["url"]))
              with zipfile.ZipFile(out) as archive:
                  if "plugin.yml" not in archive.namelist():
                      raise SystemExit(jar["filename"] + " is not a Bukkit plugin jar")
          GET

          echo "eula=true" > eula.txt
          cat > server.properties <<'PROPS'
          online-mode=false
          level-type=flat
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          max-players=5
          PROPS

          ( sleep 75
            echo "combatlog"
            sleep 3
            echo "combatlog zones"
            sleep 3
            echo "combatlog reload"
            sleep 3
            echo "stop"
            sleep 40 ) | timeout 260 java -Xmx2G -jar paper.jar --nogui > console.log 2>&1 || true

          echo "───────── plugins folder ─────────"
          ls -la plugins/
          echo "───────── relevant log lines ─────────"
          grep -aE "WorldEdit|WorldGuard|CombatLog|Could not load|UnsupportedClassVersion|ᴄᴏᴍʙᴀᴛ" console.log \
            | head -n 45 || true

          echo "───────── checks ─────────"
          grep -aq "CombatLog enabled" console.log \
            || { echo "FAIL: the plugin never finished enabling"; exit 1; }
          grep -aq "active via WorldGuard" console.log \
            || { echo "FAIL: the WorldGuard hook did not come up"; exit 1; }
          if grep -aEq "Error occurred while enabling CombatLog|Could not load 'plugins/CombatLog" console.log; then
            echo "FAIL: the plugin threw while loading"; exit 1
          fi
          if grep -ain "combatlog" console.log | grep -qi "exception\|caused by"; then
            echo "FAIL: an exception mentions the plugin"; exit 1
          fi
          echo "OK: enabled, hooked WorldGuard, commands and reload ran clean"

      - name: Publish the built jar into the repository
        run: |
          set -euo pipefail
          mkdir -p combat-log-plugin/dist
          rm -f combat-log-plugin/dist/*.jar
          cp combat-log-plugin/target/CombatLog-*.jar combat-log-plugin/dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combat-log-plugin/dist
          if git diff --cached --quiet; then
            echo "jar unchanged, nothing to publish"
            exit 0
          fi
          git commit -m "Build CombatLog jar [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
