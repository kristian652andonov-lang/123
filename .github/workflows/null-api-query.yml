name: NULL API query
run-name: api-query ${{ inputs.tag }}

# Answers "what is the exact 1.21.1 signature of ...?" for the NULL mod. The development
# container cannot download Minecraft, so this indexes the real game jar on a runner and
# prints the requested members into the job log.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Unique tag, used to find this run'
        required: true
        type: string
      classes:
        description: 'Space separated fully qualified class names (inner classes with $)'
        required: false
        default: ''
        type: string
      grep:
        description: 'Extended regex over "Class :: member" lines'
        required: false
        default: ''
        type: string
      max_lines:
        description: 'Maximum lines to print'
        required: false
        default: '600'
        type: string

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: null-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore API index
        id: index
        uses: actions/cache@v4
        with:
          path: null-mod/build/api-flat.txt
          key: api-flat-v1-${{ hashFiles('null-mod/gradle.properties', 'null-mod/ci/api-index.sh') }}

      - name: Set up Gradle
        if: steps.index.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build API index
        if: steps.index.outputs.cache-hit != 'true'
        run: |
          ./gradlew createMinecraftArtifacts --quiet
          bash ci/api-index.sh

      - name: Query
        env:
          CLASSES: ${{ inputs.classes }}
          GREP: ${{ inputs.grep }}
          MAX: ${{ inputs.max_lines }}
        run: bash ci/api-query.sh
