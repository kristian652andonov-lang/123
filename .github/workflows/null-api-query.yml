name: NULL API query

# Answers "what is the exact 1.21.1 signature of ...?" for the NULL mod. The development
# container cannot download Minecraft, so this indexes the real game jar on a runner and
# prints the lookups listed in null-mod/ci/api-queries.txt into the job log.
on:
  push:
    paths:
      - 'null-mod/ci/api-queries.txt'

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: null-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore API index
        id: index
        uses: actions/cache@v4
        with:
          path: null-mod/build/api-flat.txt
          key: api-flat-v1-${{ hashFiles('null-mod/gradle.properties', 'null-mod/ci/api-index.sh') }}

      - name: Set up Gradle
        if: steps.index.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build API index
        if: steps.index.outputs.cache-hit != 'true'
        run: |
          ./gradlew createMinecraftArtifacts --quiet
          bash ci/api-index.sh

      - name: Query
        run: bash ci/api-query.sh
