name: NULL API export

# Prints the whole API index (xz + base64, split over eight jobs) so a development
# environment without Minecraft can search every 1.21.1 signature locally.
on:
  push:
    paths:
      - 'null-mod/ci/api-export-request.txt'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: null-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore API index
        id: index
        uses: actions/cache@v4
        with:
          path: null-mod/build/api-flat.txt
          key: api-flat-v1-${{ hashFiles('null-mod/gradle.properties', 'null-mod/ci/api-index.sh') }}

      - name: Set up Gradle
        if: steps.index.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build API index
        if: steps.index.outputs.cache-hit != 'true'
        run: |
          ./gradlew createMinecraftArtifacts --quiet
          bash ci/api-index.sh

      - name: Export part ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: |
          wc -l build/api-flat.txt
          xz -9e -T0 -c build/api-flat.txt | base64 -w 120 > build/api.b64
          sha256sum build/api-flat.txt
          split -n l/8 -d -a 1 build/api.b64 build/api.part.
          echo "=====API-EXPORT-BEGIN===== part $PART of 8, $(wc -l < build/api.b64) lines total"
          cat "build/api.part.$PART"
          echo "=====API-EXPORT-END====="
