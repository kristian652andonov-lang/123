name: Build NULL mod

on:
  push:
    paths:
      - 'null-mod/**'
      - '.github/workflows/build-null-mod.yml'
  workflow_dispatch:
    inputs:
      api_dump:
        description: 'Print the public Minecraft API listed in null-mod/ci/api-classes.txt'
        type: boolean
        default: false

concurrency:
  group: null-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        working-directory: null-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compile and package
        id: build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: null-mod-jar
          path: null-mod/build/libs/null-*.jar
          if-no-files-found: error

  # Prints the public signatures of the Minecraft classes in null-mod/ci/api-classes.txt
  # into this job's log, so the code can be checked against the real 1.21.1 API.
  api-dump:
    if: inputs.api_dump || contains(github.event.head_commit.message, '[api-dump]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: null-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dump Minecraft API signatures
        run: |
          ./gradlew createMinecraftArtifacts --quiet
          bash ci/api-dump.sh > /dev/null
          echo "=====API-DUMP-BEGIN====="
          cat build/api-dump.txt
          echo "=====API-DUMP-END====="
