name: Build NULL mod

on:
  push:
    paths:
      - 'null-mod/**'
      - '!null-mod/dist/**'
      - '!null-mod/docs/**'
      - '!null-mod/**/*.md'
      - '.github/workflows/build-null-mod.yml'
  workflow_dispatch:

concurrency:
  group: null-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        working-directory: null-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Compile and package
        id: build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: null-mod-jar
          path: null-mod/build/libs/null-*.jar
          if-no-files-found: error

      # Runs every @GameTest in a GameTest server (registries, datapacks, entities, commands)
      # and fails on any failed test. The GameTest server never loads datapack dimensions, so
      # the NULL dimension is checked by DimensionSelfCheck in the two smoke tests below.
      - name: GameTests
        id: gametests
        if: steps.build.outcome == 'success'
        run: |
          timeout 1200 ./gradlew runGameTestServer --stacktrace > gametest.log 2>&1 || echo "game test server exited with $?"
          bash ci/check-gametests.sh gametest.log

      # Boots the real client on a virtual display with software OpenGL and lets
      # ClientAutoTest walk a fresh world through every stage, every random event and the
      # NULL dimension, taking screenshots on the way.
      - name: Client smoke test
        id: client
        if: always() && steps.build.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p run
          cp ci/client-options.txt run/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PnullAutotest=smoke --stacktrace > client.log 2>&1 || echo "client exited with $?"
          bash ci/check-client.sh client.log
          grep -aq "NULL-AUTOTEST: dimension self-check passed" client.log || { echo "FAIL: the NULL dimension self-check did not pass"; exit 1; }

      # Installs a real NeoForge dedicated server with the built jar, joins it with the
      # scripted client and drives every stage, every event and the NULL transition over the
      # network. Catches client classes leaking onto the server and broken stage syncing.
      - name: Multiplayer smoke test
        id: multiplayer
        if: always() && steps.build.outcome == 'success'
        run: |
          set +e
          NEO=$(grep '^neo_version=' gradle.properties | cut -d= -f2)
          mkdir -p server
          cd server
          curl -sSfL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NEO/neoforge-$NEO-installer.jar" \
            || { echo "FAIL: could not download the NeoForge installer"; exit 1; }
          java -jar installer.jar --installServer > install.log 2>&1 || { tail -n 40 install.log; echo "FAIL: server install failed"; exit 1; }
          echo "eula=true" > eula.txt
          cp ../ci/server.properties server.properties
          mkdir -p mods
          cp ../build/libs/null-*.jar mods/
          printf '\n-Dnull.autotest=server\n' >> user_jvm_args.txt
          (timeout 1800 ./run.sh nogui > console.log 2>&1 &)
          for i in $(seq 1 300); do grep -q "Done (" console.log 2>/dev/null && break; sleep 2; done
          grep -q "Done (" console.log || { tail -n 150 console.log; echo "FAIL: the dedicated server did not start"; exit 1; }
          cd ..
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -PnullAutotest=multiplayer -PnullQuickPlay=localhost:25565 --stacktrace > mpclient.log 2>&1 || echo "client exited with $?"
          sleep 20
          bash ci/check-client.sh mpclient.log
          c=$?
          bash ci/check-server.sh server/logs/latest.log
          s=$?
          pkill -f "unix_args.txt" || true
          exit $(( c | s ))

      - name: Prepare screenshots
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p screens
          for f in run/screenshots/*.png; do
            [ -f "$f" ] || continue
            java -Djava.awt.headless=true ci/Shrink.java "$f" "screens/$(basename "${f%.png}").jpg" 720
          done
          ls -la screens

      - name: Upload screenshots
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: client-screens
          path: null-mod/screens/*.jpg
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            null-mod/gametest.log
            null-mod/client.log
            null-mod/mpclient.log
            null-mod/server/logs/latest.log
            null-mod/server/console.log
            null-mod/server/crash-reports/
            null-mod/run/logs/latest.log
            null-mod/run/crash-reports/
          if-no-files-found: ignore

      - name: Publish the built jar into the repository
        if: success() && contains(github.event.head_commit.message, '[publish]')
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p null-mod/dist
          rm -f null-mod/dist/*.jar
          cp null-mod/build/libs/null-*.jar null-mod/dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add null-mod/dist
          if git diff --cached --quiet; then
            echo "jar unchanged, nothing to publish"
            exit 0
          fi
          git commit -m "Build NULL jar [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Prints the screenshots (as base64 JPEG) into job logs, split over a few jobs, so they
  # can be inspected from an environment that cannot download artifacts.
  screens:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: client-screens
          path: screens

      - name: Print screenshots part ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: |
          [ -d screens ] || { echo "no screenshots"; exit 0; }
          i=0
          for f in $(ls screens/*.jpg 2>/dev/null | sort); do
            if [ $((i % 5)) -eq "$PART" ]; then
              echo "=====SCREEN-BEGIN===== $(basename "$f")"
              base64 -w 120 "$f"
              echo "=====SCREEN-END====="
            fi
            i=$((i + 1))
          done
