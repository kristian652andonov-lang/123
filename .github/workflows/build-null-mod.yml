name: Build NULL mod

on:
  push:
    paths:
      - 'null-mod/**'
      - '.github/workflows/build-null-mod.yml'
  workflow_dispatch:
    inputs:
      api_dump:
        description: 'Print the public Minecraft API listed in null-mod/ci/api-classes.txt'
        type: boolean
        default: false

concurrency:
  group: null-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    defaults:
      run:
        working-directory: null-mod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and package
        id: build
        run: ./gradlew build --stacktrace

      - name: Dump Minecraft API signatures
        if: always() && (inputs.api_dump || contains(github.event.head_commit.message, '[api-dump]'))
        run: |
          ./gradlew createMinecraftArtifacts --stacktrace
          bash ci/api-dump.sh

      - name: Upload API dump
        if: always() && (inputs.api_dump || contains(github.event.head_commit.message, '[api-dump]'))
        uses: actions/upload-artifact@v4
        with:
          name: api-dump
          path: null-mod/build/api-dump.txt
          if-no-files-found: warn

      - name: Upload mod jar
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: null-mod-jar
          path: null-mod/build/libs/null-*.jar
          if-no-files-found: error
